<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ws2tcp</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      main {
        max-width: 52rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
      }
      .card {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      }
      code {
        background: #111827;
        border-radius: 0.375rem;
        padding: 0.125rem 0.375rem;
      }
      p { line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>ws2tcp management UI</h1>
        <p>This embedded shell is serving from the Go binary.</p>
        <p>The REST API lives under <code>/api</code> and SPA routes use history fallback.</p>
      </div>
    </main>
  </body>
</html>
